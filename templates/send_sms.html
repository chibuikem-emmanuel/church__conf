{% extends 'base.html' %}
{% block content %}

<div class="max-w-2xl mx-auto py-12 px-6">
    <!-- Breadcrumb/Back Link -->
    <a href="{% url 'attendee_list' conference.id %}"  class="flex items-center gap-2 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 hover:text-[#CC0000] mb-8 transition-all group">
        <svg class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Back to Dashboard
    </a>

    <div class="bg-white p-10 md:p-12 rounded-[3rem] shadow-[0_32px_64px_-15px_rgba(0,0,0,0.05)] border border-slate-50 relative overflow-hidden">
        <!-- Top Accent Bar -->
        <div class="absolute top-0 left-0 w-full h-2 bg-[#CC0000]"></div>

        <div class="mb-10">
            <h1 class="text-3xl font-black text-slate-900 tracking-tighter uppercase leading-none mb-3">
                SMS Broadcast
            </h1>
            <div class="flex items-center gap-2">
                <span class="inline-block w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">
                    Targeting: <span class="text-slate-900">{{ attendees|length }} Registered Attendees</span>
                </p>
            </div>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-3 ml-2">Message Content</label>
                <textarea
                    name="message"
                    rows="6"
                    required
                    class="w-full bg-slate-50 border-2 border-slate-100 rounded-[2rem] p-6 text-slate-900 placeholder-slate-400 focus:bg-white focus:border-[#CC0000] focus:ring-4 focus:ring-red-50 outline-none transition-all duration-300 font-medium text-sm"
                    placeholder="Enter update for attendees..."
                ></textarea>
                <p class="mt-3 ml-2 text-[9px] font-bold text-slate-400 uppercase tracking-tighter">
                    Note: Carriers may split messages exceeding 160 characters.
                </p>
            </div>

            <button type="submit" 
                class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase tracking-[0.25em] text-xs hover:bg-[#CC0000] transition-all transform active:scale-[0.97] shadow-xl shadow-slate-200 mt-4">
                Execute SMS Dispatch
            </button>
        </form>
    </div>

    <!-- Security Footer -->
    <div class="mt-8 text-center">
        <p class="text-[9px] font-black text-slate-300 uppercase tracking-[0.3em]">
            Protocol: Encrypted SMS Gateway Enabled
        </p>
    </div>
</div>

{% endblock %}
