{% extends 'base.html' %}

{% block content %}

<div class="flex justify-between mb-8">
<h2 class="text-2xl font-bold">Your Conferences</h2>

<a href="/create/" class="bg-indigo-600 text-white px-4 py-2 rounded-xl">
Create Conference
</a>
</div>

<div class="grid md:grid-cols-3 gap-6">

{% for conf in conferences %}
<div class="bg-white p-5 rounded-2xl shadow">

<h3 class="font-bold text-lg">{{ conf.title }}</h3>
<p class="text-sm text-gray-500">{{ conf.description }}</p>

<!-- QR -->
<img src="/qr/{{ conf.id }}/" class="w-24 mt-3 cursor-pointer"
onclick="openQR('/qr/{{ conf.id }}/')">

<!-- LINK -->
<div class="mt-3">
<input id="link{{ conf.id }}"
value="{{ request.scheme }}://{{ request.get_host }}/event/{{ conf.id }}/"
class="border p-1 text-xs w-full rounded">

<button onclick="copyLink({{ conf.id }})"
class="bg-gray-800 text-white px-2 py-1 mt-1 rounded text-xs">
Copy Link
</button>
</div>

<div class="flex justify-between mt-4">

<a href="/attendees/{{ conf.id }}/" class="text-blue-600">
Manage
</a>

<form method="POST" action="/delete-conference/{{ conf.id }}/">
{% csrf_token %}
<button class="text-red-500">Delete</button>
</form>

</div>

</div>
{% endfor %}

</div>

<!-- QR MODAL -->
<div id="qrModal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex justify-center items-center">
<img id="qrImage" class="w-96">
<button onclick="closeQR()" class="absolute top-4 right-4 text-white text-2xl">X</button>
</div>

<script>
function openQR(url){
document.getElementById('qrImage').src = url;
document.getElementById('qrModal').classList.remove('hidden');
}

function closeQR(){
document.getElementById('qrModal').classList.add('hidden');
}

function copyLink(id){
let input = document.getElementById('link'+id);
input.select();
document.execCommand("copy");
alert("Link copied!");
}
</script>

{% endblock %}
