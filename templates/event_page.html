<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | {{ conference.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>

<body class="flex justify-center items-center min-h-screen bg-stone-50 px-4">

    <div class="w-full max-w-md">
        <form method="POST" class="bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-slate-100">
            {% csrf_token %}

            <div class="bg-[#CC0000] p-10 text-center relative overflow-hidden">
                <div class="absolute inset-0 opacity-10">
                    <svg class="h-full w-full" fill="currentColor" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" />
                    </svg>
                </div>

                <div class="relative z-10">
                    <div class="inline-flex items-center justify-center w-12 h-12 bg-white/20 rounded-2xl mb-4 backdrop-blur-md">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path>
                        </svg>
                    </div>
                    <h2 class="text-2xl font-black text-white uppercase tracking-tight leading-tight">
                        Event Registration
                    </h2>
                    <p class="text-red-100/80 text-xs font-bold uppercase tracking-widest mt-2">
                        {{ conference.title }}
                    </p>
                </div>
            </div>

            <div class="p-8 space-y-5">
                
                {% if success %}
                <div class="bg-emerald-50 border border-emerald-100 text-emerald-700 p-4 rounded-2xl text-center font-bold text-sm">
                    {{ success }} 🎉
                </div>
                {% endif %}

                {% if error %}
                <div class="bg-red-50 border border-red-100 text-[#CC0000] p-4 rounded-2xl text-center font-bold text-sm">
                    {{ error }}
                </div>
                {% endif %}

                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Full Name</label>
                        <input name="name" type="text" placeholder="Emmanuel Chibuikem" 
                            class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border-2 border-slate-50 focus:border-[#CC0000] focus:bg-white focus:ring-0 outline-none transition-all font-semibold text-slate-700" required>
                    </div>

                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Email Address</label>
                        <input name="email" type="email" placeholder="example@domain.com" 
                            class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border-2 border-slate-50 focus:border-[#CC0000] focus:bg-white focus:ring-0 outline-none transition-all font-semibold text-slate-700" required>
                    </div>

                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Phone Number</label>
                        <input name="phone" type="tel" placeholder="+234..." 
                            class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border-2 border-slate-50 focus:border-[#CC0000] focus:bg-white focus:ring-0 outline-none transition-all font-semibold text-slate-700" required>
                    </div>

                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Your Expectations</label>
                        <textarea name="expectation" rows="3" placeholder="What do you hope to learn?"
                            class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border-2 border-slate-50 focus:border-[#CC0000] focus:bg-white focus:ring-0 outline-none transition-all font-semibold text-slate-700"></textarea>
                    </div>
                </div>

                <button type="submit" 
                    class="w-full bg-[#CC0000] text-white font-black py-4 rounded-2xl hover:bg-red-700 shadow-xl shadow-red-200 transition-all transform hover:-translate-y-1 active:scale-95 uppercase tracking-widest text-sm">
                    Confirm Registration
                </button>

                <p class="text-center text-slate-400 text-[10px] font-bold uppercase tracking-tighter">
                    Official Registration Portal &bull; Confy Systems
                </p>
            </div>
        </form>
        
        <div class="text-center mt-8">
            <p class="text-slate-400 text-xs font-medium uppercase tracking-widest">
                Powered by <span class="text-slate-600 font-black">Confy</span>
            </p>
        </div>
    </div>

</body>
</html>
